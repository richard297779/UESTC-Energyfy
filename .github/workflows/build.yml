name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: uestc-energy-windows
            dist: dist/uestc-energy.exe
            smoke_onefile: '.\dist\uestc-energy.exe version'
            smoke_onedir: '.\dist-onedir\uestc-energy\uestc-energy.exe version'
          - os: ubuntu-latest
            artifact: uestc-energy-linux
            dist: dist/uestc-energy
            smoke_onefile: './dist/uestc-energy version'
            smoke_onedir: './dist-onedir/uestc-energy/uestc-energy version'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compile check
        run: python -m compileall -q uestc_energy main.py

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --onefile --console
          --name uestc-energy
          --collect-submodules uestc_energy
          main.py

      - name: Build folder bundle
        run: >
          python -m PyInstaller --noconfirm --onedir --console
          --name uestc-energy
          --collect-submodules uestc_energy
          --distpath dist-onedir --workpath build-onedir --specpath build-onedir
          main.py

      - name: Smoke test executable
        run: ${{ matrix.smoke_onefile }}

      - name: Smoke test folder bundle
        run: ${{ matrix.smoke_onedir }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-onedir
          path: dist-onedir/uestc-energy
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          mkdir -p out
          mv artifacts/uestc-energy-windows/uestc-energy.exe out/uestc-energy-windows.exe
          mv artifacts/uestc-energy-linux/uestc-energy out/uestc-energy-linux
          chmod +x out/uestc-energy-linux
          cd artifacts/uestc-energy-windows-onedir && zip -qr ../../out/uestc-energy-windows-onedir.zip . && cd ../..
          cd artifacts/uestc-energy-linux-onedir && zip -qr ../../out/uestc-energy-linux-onedir.zip . && cd ../..
      - name: Generate release notes
        run: python .github/scripts/generate_release_notes.py --tag "$GITHUB_REF_NAME" --output release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: UESTC 电费监控 ${{ github.ref_name }}
          body_path: release-notes.md
          files: out/*
